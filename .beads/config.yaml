# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

# Issue prefix for this repository (used by bd init)
# If not set, bd init will auto-detect from directory name
# Example: issue-prefix: "myproject" creates issues like "myproject-1", "myproject-2", etc.
# issue-prefix: ""

# Use no-db mode: JSONL-only, no Dolt database
# When true, bd will use .beads/issues.jsonl as the source of truth
# no-db: false

# Enable JSON output by default
# json: false

# Feedback title formatting for mutating commands (create/update/close/dep/edit)
# 0 = hide titles, N > 0 = truncate to N characters
# output:
#   title-length: 255

# Default actor for audit trails (overridden by BEADS_ACTOR or --actor)
# actor: ""

# Export events (audit trail) to .beads/events.jsonl on each flush/sync
# When enabled, new events are appended incrementally using a high-water mark.
# Use 'bd export --events' to trigger manually regardless of this setting.
# events-export: false

# Multi-repo configuration (experimental - bd-307)
# Allows hydrating from multiple repositories and routing writes to the correct database
# repos:
#   primary: "."  # Primary repo (where this database lives)
#   additional:   # Additional repos to hydrate from (read-only)
#     - ~/beads-planning  # Personal planning repo
#     - ~/work-planning   # Work planning repo

# JSONL backup (periodic export for off-machine recovery)
# Auto-enabled when a git remote exists. Override explicitly:
# backup:
#   enabled: false     # Disable auto-backup entirely
#   interval: 15m      # Minimum time between auto-exports
#   git-push: false    # Disable git push (export locally only)
#   git-repo: ""       # Separate git repo for backups (default: project repo)

# Auto-export to JSONL after each mutation (bd-native).
# Disabled (2026-07-07, sc-tq3): under the sandboxed worker profile the
# post-mutation auto-export creates a temp file (.~issues.jsonl.<rand>) directly
# inside .beads/, which the sandbox denies with EROFS. The failed export leaves
# the issues.jsonl mirror stale and emits a warning on every bd write. On the
# non-sandboxed admin side the same export hits git-add and warns because
# .beads/issues.jsonl is gitignored. Keeping bd-native auto-export off removes
# that friction on both lanes.
# Premise correction (2026-07-13, sc-uew): sc-tq3's rationale "the per-machine
# JSONL mirror is non-essential" was wrong — orchestrator hydrate (bd repo
# sync) reads this mirror, so it is the cross-repo visibility interface
# (orch-89v). Mirror freshness is now provided by canonical bdw (beads-bdw
# plugin, 246e610): every successful bdw WRITE re-exports .beads/issues.jsonl
# inside the flock (fail-open; escape hatch BDW_NO_AUTOEXPORT=1; sandboxed
# workers silently skip and the next unsandboxed write refreshes the mirror).
# This setting stays false so bd itself never duplicates that export path.
export.auto: false

# Integration settings (access with 'bd config get/set')
# Non-secret keys (stored in the database):
# - jira.url, jira.project
# - linear.team_id
# - github.org, github.repo
#
# Secret keys (stored in this file but prefer env vars to avoid git exposure):
# - linear.api_key  → use LINEAR_API_KEY env var instead
# - github.token    → use GITHUB_TOKEN env var instead

# 台帳 remote はコード repo と分離する（fleet 標準・orchestrator 裁定 orch-jot0 / bd sc-zkof）。
#
# なぜ: bd の既定は台帳（refs/dolt/data）をコード repo と同じ remote へ push する。本リポは PUBLIC ゆえ、
# 台帳本文が公開読み取り可能な面に出ていた（実測: .beads/issues.jsonl に他プロジェクト名・ホスト名・
# メールアドレスが実在）。repo 単位ではなく「情報単位」で判定すると核となる private 保証が破れていた。
# 露出していた ref は 2026-07-27 に削除済み（復元点 SHA は sc-zkof / orch-jot0 の notes に記録）。
#
# 不変条件（変更するときはこの 2 本を必ず再確認する）:
#   1. git ls-remote <このコード repo> 'refs/dolt/*' が 0 件であること
#   2. sync.remote が当該コード repo を指さないこと
#
# 台帳 1 つにつき private repo 1 つが必要（dolt の push 先 ref 名は refs/dolt/data 固定で、
# 複数台帳を 1 repo に集約すると ref が衝突するため）。
# sync.remote: "git+https://github.com/shuu5/scribe-beads.git"